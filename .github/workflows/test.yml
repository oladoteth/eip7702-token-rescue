name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: npm ci

      # Contract tests, unit tests, and both anvil end-to-end tests. The mainnet fork test
      # (npm run test:fork) needs a public RPC, so it is not run here.
      - run: npm test

      - run: npm run build
